services:
  app:
    build: .
    image: tn4-app
    container_name: tn4-app
    env_file:
      - ./src/.env
    ports:
      - "80:58888"
    volumes:
      # Mount toàn bộ mã nguồn để đảm bảo dữ liệu viết ra được lưu tại thư mục dự án
      - ./:/app
      # Lưu riêng dữ liệu cấu hình/thư viện trong thư mục data để tránh ghi đè khi build
      - ./data:/app/data
      # Lưu các file cấu hình JSON, log trong thư mục database/data_setup
      - ./src/database/data_setup:/app/src/database/data_setup
    depends_on:
      - mqtt
      - influxdb

  mqtt:
    image: eclipse-mosquitto:2
    container_name: tn4-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log

  influxdb:
    image: influxdb:1.8
    container_name: tn4-influxdb
    restart: unless-stopped
    environment:
      INFLUXDB_DB: ${INFLUXDB_DATABASE:-ats_data}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_USERNAME:-admin}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_PASSWORD:-admin123}
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb

volumes:
  mosquitto-data:
  mosquitto-logs:
  influxdb-data:
